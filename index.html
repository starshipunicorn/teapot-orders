<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Little Teapot — Order Online</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF6F0;
    --warm-white: #FFFDF9;
    --espresso: #2C1A0E;
    --bark: #5C3D2E;
    --toffee: #9B6A3E;
    --gold: #C49A5A;
    --blush: #E8D5C0;
    --sage: #7A8C6E;
    --soft-border: rgba(92,61,46,0.15);
    --card-shadow: 0 2px 12px rgba(44,26,14,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--cream);
    color: var(--espresso);
    min-height: 100vh;
  }

  .hero {
    background: var(--espresso);
    color: var(--warm-white);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(196,154,90,0.04) 40px, rgba(196,154,90,0.04) 41px);
  }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
    position: relative;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.1;
    position: relative;
  }
  .hero-sub {
    margin-top: 0.75rem;
    font-size: 14px;
    color: rgba(255,253,249,0.6);
    position: relative;
  }
  .hero-ornament {
    font-size: 1.5rem;
    margin: 1rem 0 0;
    opacity: 0.4;
    position: relative;
  }

  .layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 2rem;
    align-items: start;
  }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .cart-col { position: static; order: -1; }
  }

  .category-section { margin-bottom: 2rem; }
  .category-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--bark);
    border-bottom: 1px solid var(--soft-border);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .category-title span { font-size: 1rem; }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.65rem;
  }
  .menu-item {
    background: var(--warm-white);
    border: 1px solid var(--soft-border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .menu-item:hover { border-color: var(--toffee); background: #FFF9F3; }
  .menu-item.selected { border-color: var(--toffee); background: #FFF4EA; }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .item-name { font-size: 13px; font-weight: 400; line-height: 1.4; flex: 1; }
  .item-price { font-size: 12px; color: var(--toffee); font-weight: 500; white-space: nowrap; }

  .item-qty-controls {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .menu-item.selected .item-qty-controls { display: flex; }
  .qty-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--soft-border);
    background: var(--cream);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--bark);
    line-height: 1;
    transition: background 0.1s;
  }
  .qty-btn:hover { background: var(--blush); }
  .qty-display { font-size: 13px; font-weight: 500; min-width: 16px; text-align: center; }

  .cart-col { position: sticky; top: 1.5rem; }
  .cart-card {
    background: var(--warm-white);
    border: 1px solid var(--soft-border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
  }
  .cart-header {
    background: var(--espresso);
    color: var(--warm-white);
    padding: 1rem 1.25rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header h2 { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 500; }
  .cart-badge {
    background: var(--gold);
    color: var(--espresso);
    font-size: 11px; font-weight: 500;
    border-radius: 20px; padding: 2px 8px;
  }
  .cart-body { padding: 1rem 1.25rem; }
  .cart-empty { text-align: center; padding: 2rem 0; color: var(--toffee); font-size: 13px; opacity: 0.6; }

  .cart-line {
    display: flex; justify-content: space-between;
    font-size: 13px; padding: 4px 0; gap: 0.5rem;
    border-bottom: 1px dashed rgba(92,61,46,0.08);
  }
  .cart-line:last-child { border-bottom: none; }
  .cart-line-name { flex: 1; line-height: 1.4; }
  .cart-line-price { color: var(--toffee); font-weight: 500; white-space: nowrap; }

  .cart-total {
    border-top: 1px solid var(--soft-border);
    margin-top: 0.75rem; padding-top: 0.75rem;
    display: flex; justify-content: space-between; font-weight: 500;
  }
  .total-price { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--bark); }

  .order-form { margin-top: 1rem; border-top: 1px solid var(--soft-border); padding-top: 1rem; }
  .form-field { margin-bottom: 0.75rem; }
  .form-field label {
    display: block;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--toffee); margin-bottom: 4px; font-weight: 500;
  }
  .form-field input,
  .form-field textarea,
  .form-field select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--soft-border);
    border-radius: 8px;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--espresso);
    outline: none; transition: border-color 0.15s;
  }
  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus { border-color: var(--toffee); }
  .form-field textarea { resize: vertical; min-height: 60px; }

  .currency-note { font-size: 11px; color: var(--toffee); opacity: 0.7; text-align: center; margin-top: 0.5rem; }

  .submit-btn {
    width: 100%; padding: 0.85rem;
    background: var(--espresso); color: var(--warm-white);
    border: none; border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.02em; margin-top: 0.5rem;
  }
  .submit-btn:hover { background: var(--bark); }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .status-msg {
    margin-top: 0.75rem; padding: 0.65rem 0.85rem;
    border-radius: 8px; font-size: 13px; display: none;
  }
  .status-msg.success { background: #EAF5E8; color: #2D6B26; border: 1px solid #A8D9A4; display: block; }
  .status-msg.error   { background: #FAE8E8; color: #8B2A2A; border: 1px solid #E8A8A8; display: block; }
</style>
</head>
<body>

<div class="hero">
  <p class="hero-eyebrow">Online Ordering</p>
  <h1>The Little Teapot</h1>
  <p class="hero-sub">Café &amp; Patisserie &mdash; Los Santos</p>
  <p class="hero-ornament">☕ 🫖 🍰</p>
</div>

<div class="layout">
  <div class="menu-col" id="menu-col"></div>

  <div class="cart-col">
    <div class="cart-card">
      <div class="cart-header">
        <h2>Your Order</h2>
        <span class="cart-badge" id="cart-count">0 items</span>
      </div>
      <div class="cart-body">
        <div class="cart-empty" id="cart-empty">Your order is empty.<br>Tap an item to add it.</div>
        <div id="cart-lines"></div>
        <div class="cart-total" id="cart-total" style="display:none">
          <span>Total</span>
          <span class="total-price" id="total-price">$0</span>
        </div>
        <p class="currency-note">Prices in GTA$ (in-game currency)</p>

        <div class="order-form">
          <div class="form-field">
            <label>Your name / character name</label>
            <input type="text" id="customer-name" placeholder="e.g. Violet Moreau" />
          </div>
          <div class="form-field">
            <label>Pickup or delivery?</label>
            <select id="order-type">
              <option value="Pickup">Pickup at the café</option>
              <option value="Delivery">Delivery</option>
            </select>
          </div>
          <div class="form-field">
            <label>Delivery address / location (optional)</label>
            <input type="text" id="delivery-address" placeholder="e.g. Rockford Hills, Maze Bank Tower" />
          </div>
          <div class="form-field">
            <label>Special requests (optional)</label>
            <textarea id="special-requests" placeholder="Allergies, extra items, notes…"></textarea>
          </div>
          <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Place Order →</button>
          <div class="status-msg" id="status-msg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const MENU = {
  "Hot Drinks": {
    icon: "☕",
    items: {
      "Earl Grey Tea": 50,
      "Peppermint Tea": 50,
      "Jasmine Green Tea": 50,
      "Orange Ginseng Oolong Tea": 50,
      "Vanilla Chai Latte": 50,
      "Honey Lavender Latte": 50,
      "Cozy Cappuccino": 50,
      "Hot Chocolate": 50
    }
  },
  "Cold Drinks": {
    icon: "🧋",
    items: {
      "Berry Hibiscus Iced Tea": 50,
      "Saffron Rose Iced Tea": 50,
      "Violet's Colani": 50,
      "Iced Coffee": 50,
      "Horchata": 50,
      "Green Smoothie": 50
    }
  },
  "Mains": {
    icon: "🍳",
    items: {
      "Avocado Toast w/ Fruit Salad": 120,
      "Steak & Pepper Omelet w/ Hashbrowns": 120,
      "Bacon, Egg & Cheese Sandwich": 120,
      "Chef Salad & Soup of the Day": 120,
      "Caprese Sandwich & Chips": 120,
      "Chicken & Waffles": 120
    }
  },
  "Dessert": {
    icon: "🍮",
    items: {
      "Caramel Affogato Ice Cream": 100,
      "Cranberry Almond Biscotti": 100,
      "Tiramisu Cheesecake": 100,
      "Pie in the Sky": 100
    }
  },
  "Special Item": {
    icon: "🫖",
    items: {
      "Little Teapot Brownie": 250
    }
  },
  "Bundles": {
    icon: "🎁",
    items: {
      "Number 1: 10 Mains & 10 Drinks": 1700,
      "Number 2: 20 Mains & 20 Drinks": 3400,
      "Number 3: 10 Drinks, 6 Mains, 4 Desserts": 1620,
      "Number 4: 10 Drinks, 6 Mains, 4 Specials": 2220,
      "Donut Box: Cinnamon Dolce Cronut, Strawberry Glaze & Boston Cream": 600
    }
  },
  "Extras": {
    icon: "✨",
    items: {
      "Preservatives": 50
    }
  }
};

const cart = {};

function buildMenu() {
  const col = document.getElementById('menu-col');
  for (const [cat, data] of Object.entries(MENU)) {
    const section = document.createElement('div');
    section.className = 'category-section';
    section.innerHTML = `<h2 class="category-title"><span>${data.icon}</span> ${cat}</h2><div class="items-grid" id="grid-${cat.replace(/\s/g,'_')}"></div>`;
    col.appendChild(section);
    const grid = section.querySelector('.items-grid');
    for (const [name, price] of Object.entries(data.items)) {
      const key = `${cat}::${name}`;
      const el = document.createElement('div');
      el.className = 'menu-item';
      el.id = `item-${CSS.escape(key)}`;
      el.innerHTML = `
        <div class="item-top">
          <span class="item-name">${name}</span>
          <span class="item-price">$${price.toLocaleString()}</span>
        </div>
        <div class="item-qty-controls">
          <button class="qty-btn" data-key="${key}" data-delta="-1">−</button>
          <span class="qty-display" id="qty-${CSS.escape(key)}">1</span>
          <button class="qty-btn" data-key="${key}" data-delta="1">+</button>
        </div>
      `;
      el.addEventListener('click', () => toggleItem(key, name, price));
      el.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          changeQty(btn.dataset.key, parseInt(btn.dataset.delta));
        });
      });
      grid.appendChild(el);
    }
  }
}

function toggleItem(key, name, price) {
  if (cart[key]) {
    delete cart[key];
    document.getElementById(`item-${CSS.escape(key)}`)?.classList.remove('selected');
  } else {
    cart[key] = { name, price, qty: 1 };
    document.getElementById(`item-${CSS.escape(key)}`)?.classList.add('selected');
    const qtyEl = document.getElementById(`qty-${CSS.escape(key)}`);
    if (qtyEl) qtyEl.textContent = '1';
  }
  renderCart();
}

function changeQty(key, delta) {
  if (!cart[key]) return;
  cart[key].qty = Math.max(1, cart[key].qty + delta);
  const qtyEl = document.getElementById(`qty-${CSS.escape(key)}`);
  if (qtyEl) qtyEl.textContent = cart[key].qty;
  renderCart();
}

function renderCart() {
  const lines = document.getElementById('cart-lines');
  const empty = document.getElementById('cart-empty');
  const totalEl = document.getElementById('cart-total');
  const priceEl = document.getElementById('total-price');
  const countEl = document.getElementById('cart-count');

  lines.innerHTML = '';
  const entries = Object.values(cart);

  if (entries.length === 0) {
    empty.style.display = 'block';
    totalEl.style.display = 'none';
    countEl.textContent = '0 items';
    return;
  }

  empty.style.display = 'none';
  totalEl.style.display = 'flex';

  let total = 0, count = 0;
  for (const item of entries) {
    const sub = item.price * item.qty;
    total += sub;
    count += item.qty;
    const line = document.createElement('div');
    line.className = 'cart-line';
    const label = item.qty > 1 ? `${item.name} ×${item.qty}` : item.name;
    line.innerHTML = `<span class="cart-line-name">${label}</span><span class="cart-line-price">$${sub.toLocaleString()}</span>`;
    lines.appendChild(line);
  }

  priceEl.textContent = `$${total.toLocaleString()}`;
  countEl.textContent = `${count} item${count !== 1 ? 's' : ''}`;
}

async function submitOrder() {
  const customerName = document.getElementById('customer-name').value.trim();
  const orderType    = document.getElementById('order-type').value;
  const address      = document.getElementById('delivery-address').value.trim();
  const notes        = document.getElementById('special-requests').value.trim();
  const status       = document.getElementById('status-msg');
  const btn          = document.getElementById('submit-btn');

  status.className = 'status-msg';
  status.style.display = 'none';

  if (!customerName) {
    status.textContent = 'Please enter your character name.';
    status.className = 'status-msg error';
    return;
  }
  const items = Object.values(cart);
  if (items.length === 0) {
    status.textContent = 'Your order is empty — add some items first!';
    status.className = 'status-msg error';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerName, orderType, address, notes, items }),
    });

    const data = await res.json();

    if (res.ok && data.success) {
      status.textContent = `✓ Order placed! Total: $${data.total.toLocaleString()} GTA$. We'll get started shortly!`;
      status.className = 'status-msg success';
      // Clear cart
      for (const key of Object.keys(cart)) {
        document.getElementById(`item-${CSS.escape(key)}`)?.classList.remove('selected');
        delete cart[key];
      }
      renderCart();
      document.getElementById('customer-name').value = '';
      document.getElementById('special-requests').value = '';
      document.getElementById('delivery-address').value = '';
    } else {
      status.textContent = data.error || 'Something went wrong. Please try again.';
      status.className = 'status-msg error';
    }
  } catch (err) {
    status.textContent = 'Could not reach the server. Make sure it is running.';
    status.className = 'status-msg error';
  }

  btn.disabled = false;
  btn.textContent = 'Place Order →';
}

buildMenu();
</script>
</body>
</html>
